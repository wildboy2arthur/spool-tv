[build]
  command = "pip install -r requirements-build.txt && python build.py"
  publish = "dist"

[build.environment]
  PYTHON_VERSION = "3.12"

[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "public, max-age=300"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, must-revalidate"

[[headers]]
  for = "/static/js/*"
  [headers.values]
    Cache-Control = "no-cache, must-revalidate"
